<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="RAUNAQ boutique officielle - complément alimentaire naturel premium pour la vitalité quotidienne.">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self' mailto:; upgrade-insecure-requests">
<meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()">
<meta name="theme-color" content="#14322b">
<link rel="manifest" href="site.webmanifest">
<link rel="icon" href="Logo.png" type="image/png">
<meta property="og:title" content="RAUNAQ | Boutique officielle">
<meta property="og:description" content="La formule royale RAUNAQ, une expérience e-commerce premium et multilingue.">
<meta property="og:image" content="A.png">
<title>RAUNAQ | Boutique officielle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body dir="rtl">
<nav class="nav"><div class="container nav-inner"><a class="brand" href="#top"><img src="Logo.png" alt="RAUNAQ"><span>RAUNAQ</span></a><div class="nav-links"><a href="#buy" data-i18n="nav.shop"></a><a href="#benefits" data-i18n="nav.benefits"></a><a href="#ingredients" data-i18n="nav.ingredients"></a><a href="#faq" data-i18n="nav.faq"></a></div><div class="nav-actions"><div class="lang-wrap"><select class="lang-select" id="langSelect" aria-label="Language"><option value="ar">العربية</option><option value="fr">Français</option><option value="en">English</option><option value="es">Español</option></select></div><a class="btn btn-primary" href="#buy" data-i18n="nav.cta"></a></div></div></nav>
<header class="hero" id="top"><div class="container hero-grid"><div><div class="eyebrow" data-i18n="hero.eyebrow"></div><h1 data-i18n="hero.title"></h1><p class="hero-copy" data-i18n="hero.copy"></p><div class="hero-actions"><a href="#buy" class="btn btn-primary" data-i18n="hero.buy"></a><a href="#ingredients" class="btn btn-ghost" data-i18n="hero.learn"></a></div><div class="trust-row"><div class="trust-pill"><strong>100%</strong><span data-i18n="trust.natural"></span></div><div class="trust-pill"><strong>250g</strong><span data-i18n="trust.jar"></span></div><div class="trust-pill"><strong>0</strong><span data-i18n="trust.preservatives"></span></div></div></div><div class="product-stage"><img src="A.png" alt="RAUNAQ product"></div></div></header>
<section class="buy" id="buy"><div class="container buy-grid"><div class="gallery"><figure><img src="A.png" alt="RAUNAQ packaging"></figure><figure><img src="Logo.png" alt="RAUNAQ logo"></figure><figure><img src="R.png" alt="RAUNAQ ingredients"></figure></div><div class="offer"><div class="rating" data-i18n="buy.rating"></div><h2 data-i18n="buy.title"></h2><p data-i18n="buy.copy"></p><div class="price-row"><div class="price" data-i18n="buy.price"></div><div class="old-price" data-i18n="buy.oldPrice"></div></div><label class="label" for="qty" data-i18n="buy.qty"></label><div class="qty"><button type="button" id="minus">−</button><input id="qty" value="1" inputmode="numeric" aria-label="Quantity"><button type="button" id="plus">+</button></div><button class="btn btn-primary" id="orderButton" type="button" data-i18n="buy.button"></button><p class="mini" data-i18n="buy.note"></p><div class="notice" data-i18n="buy.notice"></div></div></div></section>
<section id="benefits"><div class="container"><div class="section-head"><div class="kicker" data-i18n="benefits.kicker"></div><h2 data-i18n="benefits.title"></h2><p data-i18n="benefits.copy"></p></div><div class="cards"><article class="card"><img src="B.png" alt=""><h3 data-i18n="cards.a.title"></h3><p data-i18n="cards.a.copy"></p></article><article class="card"><img src="C.png" alt=""><h3 data-i18n="cards.b.title"></h3><p data-i18n="cards.b.copy"></p></article><article class="card"><img src="E.png" alt=""><h3 data-i18n="cards.c.title"></h3><p data-i18n="cards.c.copy"></p></article><article class="card"><img src="f.png" alt=""><h3 data-i18n="cards.d.title"></h3><p data-i18n="cards.d.copy"></p></article></div></div></section>
<section id="ingredients" class="buy"><div class="container split"><div class="split-media"><img src="R.png" alt="Natural ingredients"></div><div><div class="kicker" data-i18n="ingredients.kicker"></div><h2 data-i18n="ingredients.title"></h2><p data-i18n="ingredients.copy"></p><div class="badges"><span class="badge" data-i18n="ingredients.b1"></span><span class="badge" data-i18n="ingredients.b2"></span><span class="badge" data-i18n="ingredients.b3"></span></div><div class="notice" data-i18n="ingredients.warning"></div></div></div></section>
<section><div class="container split"><div><div class="kicker" data-i18n="pack.kicker"></div><h2 data-i18n="pack.title"></h2><p data-i18n="pack.copy"></p><div class="badges"><span class="badge" data-i18n="pack.b1"></span><span class="badge" data-i18n="pack.b2"></span><span class="badge" data-i18n="pack.b3"></span></div></div><div class="split-media"><img src="o.png" alt="Usage advice"></div></div></section>
<section class="faq" id="faq"><div class="container"><div class="section-head"><div class="kicker" data-i18n="faq.kicker"></div><h2 data-i18n="faq.title"></h2></div><div class="faq-list"><details open><summary data-i18n="faq.q1"></summary><p data-i18n="faq.a1"></p></details><details><summary data-i18n="faq.q2"></summary><p data-i18n="faq.a2"></p></details><details><summary data-i18n="faq.q3"></summary><p data-i18n="faq.a3"></p></details></div></div></section>
<div class="modal" id="orderModal" aria-hidden="true">
  <div class="modal-backdrop" data-close-order></div>
  <section class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="orderTitle">
    <button class="modal-close" type="button" data-close-order aria-label="Close">×</button>
    <div class="kicker" data-i18n="order.kicker"></div>
    <h2 id="orderTitle" data-i18n="order.title"></h2>
    <p class="modal-copy" data-i18n="order.copy"></p>
    <form id="orderForm" class="order-form">
      <label><span data-i18n="order.name"></span><input id="customerName" name="name" autocomplete="name" required></label>
      <label><span data-i18n="order.phone"></span><input id="customerPhone" name="phone" autocomplete="tel" inputmode="tel" required></label>
      <label><span data-i18n="order.city"></span><input id="customerCity" name="city" autocomplete="address-level2" required></label>
      <label><span data-i18n="order.note"></span><textarea id="customerNote" name="note" rows="3"></textarea></label>
      <div class="order-summary"><strong data-i18n="order.summary"></strong><span id="orderSummary"></span></div>
      <button class="btn btn-primary" type="submit" data-i18n="order.submit"></button>
      <p class="mini" id="orderStatus" role="status" aria-live="polite"></p>
    </form>
  </section>
</div>
<div class="sticky" id="sticky"><div class="container"><div class="sticky-product"><img src="A.png" alt=""><div><strong data-i18n="sticky.title"></strong><br><span data-i18n="sticky.copy"></span></div></div><a href="#buy" class="btn btn-primary" data-i18n="sticky.button"></a></div></div>
<footer class="footer"><div class="container"><div class="brand footer-brand">RAUNAQ</div><p data-i18n="footer.copy"></p></div></footer>
<script src="app.js" defer></script>
</body>
</html>
