<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="RAUNAQ mobile store - commande rapide et contact direct.">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; upgrade-insecure-requests">
<meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()">
<meta name="theme-color" content="#14322b">
<link rel="icon" href="Logo.png" type="image/png">
<link rel="manifest" href="site.webmanifest">
<title>RAUNAQ | Mobile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body dir="rtl" class="mobile-page">
<nav class="mobile-top"><a class="brand" href="#top"><img src="Logo.png" alt="RAUNAQ"><span>RAUNAQ</span></a><select class="lang-select" id="langSelect" aria-label="Language"><option value="ar">العربية</option><option value="fr">Français</option><option value="en">English</option><option value="es">Español</option></select></nav>
<header class="mobile-hero" id="top"><div class="mobile-copy"><div class="eyebrow" data-i18n="hero.eyebrow"></div><h1 data-i18n="hero.title"></h1><p data-i18n="hero.copy"></p></div><img src="assets/A-mobile.png" alt="RAUNAQ product"><div class="mobile-price"><strong data-i18n="buy.price"></strong><span data-i18n="buy.oldPrice"></span></div><a href="#buy" class="btn btn-primary" data-i18n="hero.buy"></a></header>
<main>
<section class="mobile-buy buy" id="buy"><div class="offer"><div class="rating" data-i18n="buy.rating"></div><h2 data-i18n="buy.title"></h2><p data-i18n="buy.copy"></p><label class="label" for="qty" data-i18n="buy.qty"></label><div class="qty"><button type="button" id="minus">−</button><input id="qty" value="1" inputmode="numeric" aria-label="Quantity"><button type="button" id="plus">+</button></div><button class="btn btn-primary" id="orderButton" type="button" data-i18n="buy.button"></button><div class="notice" data-i18n="buy.notice"></div></div></section>
<section class="mobile-benefits" id="benefits"><div class="section-head"><div class="kicker" data-i18n="benefits.kicker"></div><h2 data-i18n="benefits.title"></h2></div><div class="mobile-cards"><article class="card"><img src="assets/B-mobile.png" alt=""><h3 data-i18n="cards.a.title"></h3></article><article class="card"><img src="assets/C-mobile.png" alt=""><h3 data-i18n="cards.b.title"></h3></article><article class="card"><img src="assets/E-mobile.png" alt=""><h3 data-i18n="cards.c.title"></h3></article><article class="card"><img src="assets/f-mobile.png" alt=""><h3 data-i18n="cards.d.title"></h3></article></div></section>
<section id="ingredients" class="mobile-ingredients buy"><img src="assets/R-mobile.png" alt="Natural ingredients"><div><div class="kicker" data-i18n="ingredients.kicker"></div><h2 data-i18n="ingredients.title"></h2><p data-i18n="ingredients.copy"></p></div></section>
<section class="contact" id="contact"><div class="container"><div class="kicker" data-i18n="contact.kicker"></div><h2 data-i18n="contact.title"></h2><p data-i18n="contact.copy"></p><div class="social-grid"><a class="social-link whatsapp" href="https://wa.me/212600000000" target="_blank" rel="noopener noreferrer"><span>WA</span><strong>WhatsApp</strong></a><a class="social-link instagram" href="https://www.instagram.com/raunaq" target="_blank" rel="noopener noreferrer"><span>IG</span><strong>Instagram</strong></a><a class="social-link facebook" href="https://www.facebook.com/raunaq" target="_blank" rel="noopener noreferrer"><span>FB</span><strong>Facebook</strong></a><a class="social-link tiktok" href="https://www.tiktok.com/@raunaq" target="_blank" rel="noopener noreferrer"><span>TT</span><strong>TikTok</strong></a></div></div></section>
<section class="faq" id="faq"><div class="container"><div class="section-head"><div class="kicker" data-i18n="faq.kicker"></div><h2 data-i18n="faq.title"></h2></div><div class="faq-list"><details open><summary data-i18n="faq.q1"></summary><p data-i18n="faq.a1"></p></details><details><summary data-i18n="faq.q2"></summary><p data-i18n="faq.a2"></p></details></div></div></section>
</main>
<div class="modal" id="orderModal" aria-hidden="true"><div class="modal-backdrop" data-close-order></div><section class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="orderTitle"><button class="modal-close" type="button" data-close-order aria-label="Close">×</button><div class="kicker" data-i18n="order.kicker"></div><h2 id="orderTitle" data-i18n="order.title"></h2><p class="modal-copy" data-i18n="order.copy"></p><form id="orderForm" class="order-form"><label><span data-i18n="order.name"></span><input id="customerName" name="name" autocomplete="name" required></label><label><span data-i18n="order.phone"></span><input id="customerPhone" name="phone" autocomplete="tel" inputmode="tel" required></label><label><span data-i18n="order.city"></span><input id="customerCity" name="city" autocomplete="address-level2" required></label><label><span data-i18n="order.note"></span><textarea id="customerNote" name="note" rows="3"></textarea></label><div class="order-summary"><strong data-i18n="order.summary"></strong><span id="orderSummary"></span></div><button class="btn btn-primary" type="submit" data-i18n="order.submit"></button><p class="mini" id="orderStatus" role="status" aria-live="polite"></p></form></section></div>
<div class="chatbot" id="chatbot"><button class="chat-toggle" id="chatToggle" type="button" aria-expanded="false"><span>RA</span><strong data-i18n="chat.button"></strong></button><section class="chat-panel" id="chatPanel" aria-hidden="true"><div class="chat-head"><div><strong>RAUNAQ</strong><span data-i18n="chat.subtitle"></span></div><button type="button" id="chatClose" aria-label="Close">×</button></div><div class="chat-log" id="chatLog"></div><form class="chat-form" id="chatForm"><input id="chatInput" autocomplete="off" data-i18n-placeholder="chat.placeholder"><button type="submit" data-i18n="chat.send"></button></form></section></div>
<div class="sticky" id="sticky"><div class="container"><div class="sticky-product"><img src="assets/A-mobile.png" alt=""><div><strong data-i18n="sticky.title"></strong><br><span data-i18n="sticky.copy"></span></div></div><a href="#buy" class="btn btn-primary" data-i18n="sticky.button"></a></div></div>
<footer class="footer"><div class="container"><div class="brand footer-brand">RAUNAQ</div><p data-i18n="footer.copy"></p><a href="index.html" id="desktopVersion" class="version-link">Version ordinateur</a></div></footer>
<script src="app.js" defer></script>
</body>
</html>
